# Local Postgres for development and integration tests.
# Port 54329 avoids clashing with a Postgres already running on 5432.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: skipq
      POSTGRES_PASSWORD: skipq
      POSTGRES_DB: skipq
    ports:
      - "127.0.0.1:54329:5432"
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=128MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skipq -d skipq"]
      interval: 2s
      timeout: 3s
      retries: 15
    deploy:
      resources:
        limits:
          memory: 512m

  # The HTTP API. Off by default; start it with:
  #   docker compose --profile server up -d --build
  skipq:
    profiles: ["server"]
    build: .
    environment:
      DATABASE_URL: postgres://skipq:skipq@postgres:5432/skipq?sslmode=disable
      SKIPQ_API_TOKEN: ${SKIPQ_API_TOKEN:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
