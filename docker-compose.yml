# Local Postgres for development and integration tests.
# Port 54329 avoids clashing with a Postgres already running on 5432.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: skipq
      POSTGRES_PASSWORD: skipq
      POSTGRES_DB: skipq
    ports:
      - "127.0.0.1:54329:5432"
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=128MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skipq -d skipq"]
      interval: 2s
      timeout: 3s
      retries: 15
    deploy:
      resources:
        limits:
          memory: 512m
